name: Track prices

on:
  schedule:
    - cron: "17 * * * *" # hourly check; minute 17 avoids the top-of-the-hour congestion
    - cron: "47 6 * * *" # daily report, 06:47 UTC
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [both, track, report]
        default: both

permissions:
  contents: write

# Tracking and reporting both write to the repo: never two at once.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The route lives in a secret: the repository and its logs can be public.
      TRACKER_CONFIG: ${{ secrets.TRACKER_CONFIG }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Pick task
        id: task
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.task }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then t="$CHOSEN"
          elif [ "$CRON" = "47 6 * * *" ]; then t=report
          else t=track; fi
          echo "task=$t" >> "$GITHUB_OUTPUT"

      - name: Track prices
        if: steps.task.outputs.task != 'report'
        run: |
          pip install -q -r requirements.txt
          python track.py

      - name: Build report
        if: steps.task.outputs.task != 'track'
        run: |
          pip install -q -r requirements-report.txt
          python analyze.py

      # Also when tracking fails, so the attempt is recorded in data/runs.csv.
      - name: Save to repository
        if: always() && steps.task.outcome == 'success'
        env:
          TASK: ${{ steps.task.outputs.task }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -q -m "$TASK: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
